<!DOCTYPE html>
<html lang="pt-BR" data-theme="bege">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Cachos & Café</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="header"></div>

  <main class="secao">
    <h1 class="titulo">Fale com a gente</h1>
    <p class="subtitulo">Dúvidas sobre seu tipo de cacho ou sobre um pedido? Mande uma mensagem.</p>

    <div class="contato-wrap">
      <form id="formContato" class="form" novalidate>
        <label>Nome
          <input type="text" id="nome" placeholder="Seu nome" required>
        </label>
        <label>E-mail
          <input type="email" id="email" placeholder="voce@email.com" required>
        </label>
        <label>Tipo de cacho
          <select id="tipo">
            <option>2A / 2B / 2C (ondulado)</option>
            <option>3A / 3B / 3C (cacheado)</option>
            <option>4A / 4B / 4C (crespo)</option>
            <option>Ainda não sei</option>
          </select>
        </label>
        <label>Mensagem
          <textarea id="mensagem" rows="5" placeholder="Como podemos ajudar?" required></textarea>
        </label>
        <p id="formMsg" class="form-msg"></p>
        <button type="submit" class="btn">Enviar mensagem</button>
      </form>

      <aside class="card-info">
        <h3>Nossos canais</h3>
        <p>📍 Recife, PE</p>
        <p>📧 contato@cachosecafe.com</p>
        <p>📱 (81) 9 1234-5678</p>
        <p>🕘 Seg a Sex, 9h às 18h</p>
        <a href="index.html" class="btn btn-outline" style="margin-top:1rem">← Voltar ao início</a>
      </aside>
    </div>
  </main>

  <div id="footer"></div>
  <script src="script.js"></script>
</body>

</html>
